<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="50%" stop-color="#1b263b"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dabf7"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- decorative grid lines for depth -->
  <g stroke="#22d3ee" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- floating array/matrix motif top-left -->
  <g opacity="0.5" filter="url(#glow)">
    <rect x="60" y="50" width="26" height="26" rx="4" fill="none" stroke="#4dabf7" stroke-width="2"/>
    <rect x="90" y="50" width="26" height="26" rx="4" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <rect x="120" y="50" width="26" height="26" rx="4" fill="none" stroke="#4dabf7" stroke-width="2"/>
    <rect x="60" y="80" width="26" height="26" rx="4" fill="#22d3ee" fill-opacity="0.25" stroke="#22d3ee" stroke-width="2"/>
    <rect x="90" y="80" width="26" height="26" rx="4" fill="none" stroke="#4dabf7" stroke-width="2"/>
    <rect x="120" y="80" width="26" height="26" rx="4" fill="#4dabf7" fill-opacity="0.25" stroke="#4dabf7" stroke-width="2"/>
  </g>

  <!-- matrix motif bottom-right -->
  <g opacity="0.5" filter="url(#glow)">
    <rect x="1010" y="200" width="26" height="26" rx="4" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <rect x="1040" y="200" width="26" height="26" rx="4" fill="#4dabf7" fill-opacity="0.25" stroke="#4dabf7" stroke-width="2"/>
    <rect x="1070" y="200" width="26" height="26" rx="4" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <rect x="1010" y="230" width="26" height="26" rx="4" fill="#22d3ee" fill-opacity="0.25" stroke="#22d3ee" stroke-width="2"/>
    <rect x="1040" y="230" width="26" height="26" rx="4" fill="none" stroke="#4dabf7" stroke-width="2"/>
    <rect x="1070" y="230" width="26" height="26" rx="4" fill="none" stroke="#22d3ee" stroke-width="2"/>
  </g>

  <circle cx="1100" cy="70" r="60" fill="url(#dotGlow)"/>
  <circle cx="100" cy="230" r="70" fill="url(#dotGlow)"/>

  <!-- 3D text: shadow layers first for depth -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800" text-anchor="middle">
    <text x="604" y="146" font-size="68" fill="url(#shadowGrad)" opacity="0.7">NumPy Mastery Journey</text>
    <text x="602" y="144" font-size="68" fill="#020617" opacity="0.6">NumPy Mastery Journey</text>
    <text x="600" y="142" font-size="68" fill="url(#textGrad)" filter="url(#glow)">NumPy Mastery Journey</text>
  </g>

  <text x="600" y="185" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle" letter-spacing="2">
    10 DAYS · ARRAYS TO CAPSTONE PROJECT
  </text>

  <!-- bottom accent line -->
  <rect x="450" y="205" width="300" height="4" rx="2" fill="url(#textGrad)"/>
</svg>
